name: Test and coverage

# This workflow runs on every push to collect code coverage from Bash scripts
# and uploads the results to Codecov for tracking and visualization.
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository code
      # fetch-depth: 2 is required for Codecov to properly detect the commit SHA.
      # Codecov needs access to the parent commit to calculate diffs, especially
      # for merge commits. Without this, you may see errors like:
      # "Issue detecting commit SHA. Please run actions/checkout with fetch-depth > 1 or set to 0"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Set up Ruby environment
      # bashcov is a Ruby-based tool, so we need Ruby installed to run it
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head

      # Install Ruby dependencies from Gemfile
      # - bashcov: Runs Bash scripts with coverage instrumentation
      # - simplecov-cobertura: Converts coverage reports to Cobertura XML format
      #   (Codecov requires XML, not the default HTML output)
      - name: Install Ruby dependencies
        run: bundle update --bundler && bundle install

      # Run the Bash script with coverage collection
      # bashcov instruments the script and tracks which lines are executed,
      # generating coverage data that SimpleCov processes
      - name: Run script
        run: bashcov script.sh

      # Upload coverage report to Codecov
      # The coverage.xml file is generated by simplecov-cobertura (configured in .simplecov)
      - name: Upload reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_ORG_TOKEN }}
        with:
          fail_ci_if_error: true
          files: coverage/coverage.xml
